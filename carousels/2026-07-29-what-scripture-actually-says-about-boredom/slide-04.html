    <h2 class="step-title">Be still, and know.</h2>
    <p class="step-body">Before the feed ever shows up to fill the silence, God already said what to do with it. "Be still, and know that I am God" (Psalm 46:10). Not entertained. Not busy. <span class="underline">Still</span>. The quiet you keep swiping past is the room where God actually meets a man.</p>
