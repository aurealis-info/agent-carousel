<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact sheet — What Scripture Actually Says About Boredom</title>
  <style>
    html, body { margin: 0; padding: 24px; background: #111; font-family: sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .cell { position: relative; }
    .cell iframe {
      width: 360px; height: 450px;
      border: 1px solid #333;
      transform: scale(1);
      transform-origin: top left;
    }
    .cell span {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="cell"><iframe src="slide-01.html" scrolling="no"></iframe><span>slide-01 (hook)</span></div>
    <div class="cell"><iframe src="slide-02.html" scrolling="no"></iframe><span>slide-02 (step 01)</span></div>
    <div class="cell"><iframe src="slide-03.html" scrolling="no"></iframe><span>slide-03 (step 02)</span></div>
    <div class="cell"><iframe src="slide-04.html" scrolling="no"></iframe><span>slide-04 (step 03)</span></div>
    <div class="cell"><iframe src="slide-05.html" scrolling="no"></iframe><span>slide-05 (step 04)</span></div>
    <div class="cell"><iframe src="slide-06.html" scrolling="no"></iframe><span>slide-06 (closer)</span></div>
  </div>
</body>
</html>
