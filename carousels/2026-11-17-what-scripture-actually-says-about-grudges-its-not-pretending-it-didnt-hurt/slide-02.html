    <h2 class="step-title">Scripture names the wrong.</h2>
    <p class="step-body">Joseph didn’t pretend. He looked his brothers in the eye and said it: you meant evil against me. Forgiveness starts by calling the wrong what it was. Saying “it’s fine” when it isn’t forgives nothing. It just buries it.</p>
