      <h2 class="step-title">Say the true thing</h2>
    </div>
    <div class="step-body">
        <p>"I'm good" is a lie with good manners.</p>
        <p>Tell him what actually happened this week.</p>
    </div>
    <ul class="step-points">
        <li>Say what you did, not how you feel about it.</li>
        <li>Keep it to two lines.</li>
    </ul>
    <p class="step-closing">Example: "Rough week. Went back to the old stuff."</p>
