      <li class="list-item">
        <p class="line"><span class="num">1.</span> "I was wrong."</p>
        <p class="gloss">No "but" after it.</p>
      </li>
      <li class="list-item">
        <p class="line"><span class="num">2.</span> "I don't know."</p>
        <p class="gloss">Faking an answer is pride in a nicer shirt.</p>
      </li>
      <li class="list-item">
        <p class="line"><span class="num">3.</span> "I need help."</p>
        <p class="gloss">Strong men keep numbers they can call.</p>
      </li>
      <li class="list-item">
        <p class="line"><span class="num">4.</span> "Thank you, Lord."</p>
        <p class="gloss">At the table, in the restaurant, out loud.</p>
      </li>
