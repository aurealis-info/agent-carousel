    <h2 class="step-title">Humility isn't hiding your gifts.</h2>
    <p class="step-body">Downplaying what God gave you isn't humble, it's ungrateful. Micah 6:8 puts <span class="underline">walking humbly</span> right next to doing justice, not instead of it. Use what you were given. Just don't take the credit for it.</p>
