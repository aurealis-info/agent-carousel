        <h2 class="step-title">Ask one honest question first</h2>
      </div>
      <div class="step-body">
        <p>Before you explain yourself, ask one thing: is it true.</p>
        <p>Not is it fair. Not is it the right tone. Just true or not.</p>
      </div>
      <ul class="step-points">
        <li>If it's true, say thank you before you say anything else.</li>
        <li>If it's not, correct it once, calmly, and let it go.</li>
      </ul>
    </div>
    <div class="watermark">ETHOS</div>
