      <h2 class="step-title">Name what you kept reaching for</h2>

    <div class="step-body"><p>Every reach is a want. Boredom, loneliness, a low hum of dread.</p><p>Name it before it names you.</p></div>

    <p class="step-closing">What you reach for shows what you haven't handed to Him.</p>
