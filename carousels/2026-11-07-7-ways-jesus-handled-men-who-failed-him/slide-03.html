        <p class="gloss">He grabbed him first. The question came after.</p>
      </li>
      <li class="list-item">
        <p class="line"><span class="num">6.</span> He called Judas friend.</p>
        <p class="gloss">Even at the kiss, He never stopped offering.</p>
      </li>
      <li class="list-item">

        <p class="gloss">The man hunting His church became His apostle.</p>
