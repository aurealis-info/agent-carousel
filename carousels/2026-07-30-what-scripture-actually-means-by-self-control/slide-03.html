    <h2 class="step-title">Self-control was never a muscle.</h2>
    <p class="step-body">Paul doesn't call it grit or your own discipline. He calls it fruit, something that grows out of a root, not something you manufacture by force. A branch doesn't strain to produce fruit. It just stays connected to what's <span class="underline">feeding it</span>.</p>
