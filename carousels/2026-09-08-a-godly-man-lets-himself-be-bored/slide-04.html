    <h2 class="step-title">This is what silence is for.</h2>
    <p class="step-body">You can't hear God over your own noise. Elijah didn't find Him in the wind or the fire. He found Him in <span class="underline">the still, small voice</span>, after everything loud had already passed. Ten minutes without the phone is ten minutes He can actually reach you.</p>
