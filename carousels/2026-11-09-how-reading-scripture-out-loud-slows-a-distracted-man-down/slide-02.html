<div class="slide step">

    <div class="step-head">
      <span class="step-label">Step 1</span>
      <h2 class="step-title">Pick a passage you can finish</h2>
    </div>
    <div class="step-body"><p>Not a chapter. A paragraph.</p><p>You can’t be slowed down by something you never get through.</p></div>
    <ul class="step-points"><li>Try Psalm 1 or the first ten verses of Mark 1.</li><li>Set a five minute timer and stop when it ends.</li></ul>
    <p class="step-closing">Small enough to finish beats big enough to impress.</p>
