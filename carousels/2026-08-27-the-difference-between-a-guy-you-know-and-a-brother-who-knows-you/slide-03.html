    <h2 class="step-title">The test is what they know about your worst week</h2>
    <p class="step-body">Ask yourself honestly: do the men around you know about the thing you're most ashamed of, or only the version of you that's easy to be proud of. A brother is a man who's seen the worst of you and stayed anyway.</p>
