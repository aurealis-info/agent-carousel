    <h2 class="step-title">Rest is a command, not a reward.</h2>
    <p class="step-body">Six days you shall labor, but the seventh is a Sabbath to the Lord your God (Exodus 20:9-10). That's older than your inbox, and it was never about deserving a break. It's an order for a man who thinks the world stops if <span class="underline">he does</span>.</p>
