    <h2 class="step-title">The word "perfect" means whole, not spotless.</h2>
    <p class="step-body">In the Greek it's <span class="underline">teleios</span>, the word for reaching what you were made for. Jesus says it right after telling you to love people who are hard to love, the way your Father does. Wholehearted. Not error-free.</p>
